<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت · هلدینگ آرمان</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/admin/admin.css?v=3">
</head>
<body>
<div id="boot" class="boot"><div class="boot-card">در حال بارگذاری پنل مدیریت…</div></div>

<section id="login" class="gate" hidden>
  <form id="loginForm" class="gate-card" autocomplete="on">
    <div class="gate-brand">
      <span class="gate-mark">A</span>
      <div>
        <h1>پنل مدیریت</h1>
        <p>هلدینگ آرمان · دسترسی مدیران</p>
      </div>
    </div>
    <label>نام کاربری<input name="username" autocomplete="username" required autofocus></label>
    <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="err" hidden></p>
    <button class="btn pri" type="submit">ورود به پنل</button>
    <a class="gate-back" href="/">بازگشت به سامانه CRM</a>
  </form>
</section>

<div id="shell" class="shell" hidden>
  <aside class="aside">
    <div class="aside-brand">
      <span class="gate-mark sm">A</span>
      <div>
        <strong>پنل مدیریت</strong>
        <small>هلدینگ آرمان</small>
      </div>
    </div>
    <nav id="nav" class="aside-nav"></nav>
    <div class="aside-foot">
      <div id="who" class="who"></div>
      <div class="aside-actions">
        <a class="btn ghost" href="/">سامانه CRM</a>
        <button type="button" class="btn ghost" id="btnLogout">خروج</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="main-head">
      <div>
        <p class="eyebrow" id="eyebrow">مدیریت</p>
        <h2 id="pageTitle">نمای کلی</h2>
      </div>
      <div id="headActions" class="head-actions"></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="/admin/admin.js?v=3"></script>
</body>
</html>
